# Errores de aplicación (ProblemDetailFromApplicationErrorAssembler)
error.validation.message=La validación falló
error.business-rule.message=Se infringió una regla de negocio
error.unexpected.message=Error inesperado
error.not-found.message=Recurso no encontrado
error.conflict.message=Conflicto con el recurso
error.generic.message=Error de la aplicación
error.unexpected.context=global-exception-handler
error.profile-not-found.message=Perfil no encontrado
error.user-conflict.message=El usuario ya existe

# Validación de solicitudes (GlobalExceptionHandler)
validation.request.failed=La validación de la solicitud falló
validation.request.argument=argumento-de-solicitud
validation.field.prefix=Campo
validation.not-blank=es obligatorio
validation.email=debe ser un correo electrónico válido

# category
category.error.name.notBlank=name no debe ser nulo ni estar en blanco.
category.error.name.size=name no debe superar los 128 caracteres.
category.error.tone.notBlank=tone no debe ser nulo ni estar en blanco.
category.error.tone.pattern=tone debe ser GREEN, BLUE, ORANGE, YELLOW o NEUTRAL.

# inventory
inventory.error.expirationDate.notNull=expirationDate es obligatorio.
inventory.error.lotCode.notBlank=lotCode no debe ser nulo ni estar vacío.
inventory.error.lotCode.pattern=lotCode contiene caracteres no válidos. Solo se permiten letras, dígitos y guiones.
inventory.error.lotCode.size=lotCode no debe superar los 32 caracteres.
inventory.error.minimarketId.notBlank=minimarketId no debe ser nulo ni estar vacío.
inventory.error.minimarketId.pattern=minimarketId contiene caracteres no válidos. Solo se permiten letras, dígitos, guiones bajos y guiones.
inventory.error.minimarketId.size=minimarketId no debe superar los 256 caracteres.
inventory.error.minimumStock.min=minimumStock no puede ser negativo.
inventory.error.minimumStock.notNull=minimumStock es obligatorio.
inventory.error.movementReason.required=reason es obligatorio para los movimientos ADJUSTMENT y WASTE.
inventory.error.movementReason.size=reason no debe superar los 256 caracteres.
inventory.error.movementType.notBlank=type no debe ser nulo ni estar vacío.
inventory.error.movementType.pattern=type debe ser ENTRY, EXIT, ADJUSTMENT o WASTE.
inventory.error.offerPrice.notNull=price es obligatorio.
inventory.error.offerPrice.positive=price debe ser mayor que cero.
inventory.error.offerPrice.scale=price debe tener como máximo 8 dígitos enteros y 2 decimales.
inventory.error.productId.notBlank=productId no debe ser nulo ni estar vacío.
inventory.error.productId.pattern=productId contiene caracteres no válidos. Solo se permiten letras, dígitos, guiones bajos y guiones.
inventory.error.productId.size=productId no debe superar los 256 caracteres.
inventory.error.quantity.notNull=quantity es obligatorio.
inventory.error.quantity.positive=quantity debe ser mayor que cero.
inventory.error.stockLotId.min=stockLotId debe ser mayor que cero.
inventory.error.stockLotId.notNull=stockLotId es obligatorio.

# notification
notification.error.minimarketId.notBlank=minimarketId no debe ser nulo ni estar vacío.
notification.error.minimarketId.pattern=minimarketId contiene caracteres no válidos. Solo se permiten letras, dígitos, guiones bajos y guiones.
notification.error.minimarketId.size=minimarketId no debe exceder 256 caracteres.
notification.error.severity.notBlank=La severidad de la notificación es obligatoria.
notification.error.severity.pattern=La severidad de la notificación debe ser INFO, WARNING o CRITICAL.
notification.error.title.notBlank=El título de la notificación es obligatorio.
notification.error.title.size=El título de la notificación no debe superar los 150 caracteres.
notification.error.type.notBlank=El tipo de notificación es obligatorio.
notification.error.type.pattern=El tipo de notificación debe ser EXPIRATION, CONSERVATION, LOW_STOCK, REPLENISHMENT u ORDER.

# offer
offer.error.endsOn.notNull=endsOn es obligatorio.
offer.error.period.invalid=endsOn no puede ser anterior a startsOn.
offer.error.startsOn.notNull=startsOn es obligatorio.

