# product
product.error.categoryId.invalid=categoryId debe ser mayor que 0.
product.error.categoryId.notNull=categoryId es obligatorio.
product.error.minimumStock.min=minimumStock no debe ser negativo.
product.error.minimumStock.notNull=minimumStock es obligatorio.
product.error.name.notBlank=name no debe ser nulo ni estar en blanco.
product.error.name.size=name no debe superar los 256 caracteres.
product.error.sku.notBlank=sku no debe ser nulo ni estar en blanco.
