# Application errors (ProblemDetailFromApplicationErrorAssembler)
error.validation.message=Validation failed
error.business-rule.message=Business rule violation
error.unexpected.message=Unexpected error
error.not-found.message=Resource not found
error.conflict.message=Resource conflict
error.generic.message=Application error
error.unexpected.context=global-exception-handler
error.profile-not-found.message=Profile not found
error.user-conflict.message=User already exists

# Request validation (GlobalExceptionHandler)
validation.request.failed=Request validation failed
validation.request.argument=request-argument
validation.field.prefix=Field
validation.not-blank=is required
validation.email=must be a valid email address

# category
category.error.name.notBlank=name must not be null or blank.
category.error.name.size=name must not exceed 128 characters.
category.error.tone.notBlank=tone must not be null or blank.
category.error.tone.pattern=tone must be GREEN, BLUE, ORANGE, YELLOW or NEUTRAL.

# inventory
inventory.error.expirationDate.notNull=expirationDate is required.
inventory.error.lotCode.notBlank=lotCode must not be null or blank.
inventory.error.lotCode.pattern=lotCode contains invalid characters. Only letters, digits and hyphens are allowed.
inventory.error.lotCode.size=lotCode must not exceed 32 characters.
inventory.error.minimarketId.notBlank=minimarketId must not be null or blank.
inventory.error.minimarketId.pattern=minimarketId contains invalid characters. Only letters, digits, underscores and hyphens are allowed.
inventory.error.minimarketId.size=minimarketId must not exceed 256 characters.
inventory.error.minimumStock.min=minimumStock must not be negative.
inventory.error.minimumStock.notNull=minimumStock is required.
inventory.error.movementReason.required=reason is required for ADJUSTMENT and WASTE movements.
inventory.error.movementReason.size=reason must not exceed 256 characters.
inventory.error.movementType.notBlank=type must not be null or blank.
inventory.error.movementType.pattern=type must be ENTRY, EXIT, ADJUSTMENT or WASTE.
inventory.error.offerPrice.notNull=price is required.
inventory.error.offerPrice.positive=price must be greater than zero.
inventory.error.offerPrice.scale=price must have at most 8 integer digits and 2 decimals.
inventory.error.productId.notBlank=productId must not be null or blank.
inventory.error.productId.pattern=productId contains invalid characters. Only letters, digits, underscores and hyphens are allowed.
inventory.error.productId.size=productId must not exceed 256 characters.
inventory.error.quantity.notNull=quantity is required.
inventory.error.quantity.positive=quantity must be greater than zero.
inventory.error.stockLotId.min=stockLotId must be greater than zero.
inventory.error.stockLotId.notNull=stockLotId is required.

# notification
notification.error.severity.notBlank=The notification severity is required.
notification.error.severity.pattern=The notification severity must be INFO, WARNING or CRITICAL.
notification.error.title.notBlank=The notification title is required.
notification.error.title.size=The notification title must not exceed 150 characters.
notification.error.type.notBlank=The notification type is required.
notification.error.type.pattern=The notification type must be EXPIRATION, CONSERVATION, LOW_STOCK, REPLENISHMENT or ORDER.

# offer
offer.error.endsOn.notNull=endsOn is required.
offer.error.period.invalid=endsOn must not be before startsOn.
offer.error.startsOn.notNull=startsOn is required.

# offeredProduct
offeredProduct.error.expiresOn.notNull=expiresOn is required.
offeredProduct.error.lotCode.notBlank=lotCode must not be null or blank.
offeredProduct.error.lotCode.pattern=lotCode contains invalid characters.
offeredProduct.error.lotCode.size=lotCode must not exceed 32 characters.
offeredProduct.error.productId.notBlank=productId must not be null or blank.
offeredProduct.error.productId.pattern=productId contains invalid characters.
offeredProduct.error.productId.size=productId must not exceed 256 characters.
offeredProduct.error.quantity.min=availableQuantity must not be negative.
offeredProduct.error.quantity.notNull=availableQuantity is required.
offeredProduct.error.supplierId.notBlank=supplierId must not be null or blank.
offeredProduct.error.supplierId.pattern=supplierId contains invalid characters.
offeredProduct.error.supplierId.size=supplierId must not exceed 256 characters.

# product
product.error.categoryId.invalid=categoryId must be greater than 0.
product.error.categoryId.notNull=categoryId is required.
product.error.minimumStock.min=minimumStock must not be negative.
product.error.minimumStock.notNull=minimumStock is required.
product.error.name.notBlank=name must not be null or blank.
product.error.name.size=name must not exceed 256 characters.
product.error.sku.notBlank=sku must not be null or blank.
product.error.sku.pattern=sku contains invalid characters. Only uppercase letters, digits and '-' are allowed.
product.error.sku.size=sku must not exceed 32 characters.
product.error.supplierId.pattern=supplierId contains invalid characters. Only letters, digits, '_' and '-' are allowed.
product.error.supplierId.size=supplierId must not exceed 256 characters.
product.error.unit.notBlank=unit must not be null or blank.
product.error.unit.pattern=unit must be UNIT, KG, LITER or PACK.

# profile
profile.error.expirationDays.notNull=expiration days must not be null.
profile.error.expirationDays.range=expiration days must be between 1 and 365.
profile.error.language.notBlank=language must not be null or blank.
profile.error.language.pattern=language must be EN or ES.
profile.error.userId.min=userId must be greater than 0.

# shipmentOrder
shipmentOrder.error.decidedBy.min=decidedBy must be greater than zero.
shipmentOrder.error.decidedBy.notNull=decidedBy is required.
shipmentOrder.error.expiresOn.notNull=expiresOn is required.
shipmentOrder.error.lines.notEmpty=At least one shipment order line is required.
shipmentOrder.error.lotCode.notBlank=lotCode must not be null or blank.
shipmentOrder.error.lotCode.pattern=lotCode contains invalid characters.
shipmentOrder.error.lotCode.size=lotCode must not exceed 32 characters.
shipmentOrder.error.minimarketId.notBlank=minimarketId must not be null or blank.
shipmentOrder.error.minimarketId.pattern=minimarketId contains invalid characters.
shipmentOrder.error.minimarketId.size=minimarketId must not exceed 256 characters.
shipmentOrder.error.productId.notBlank=productId must not be null or blank.
shipmentOrder.error.productId.pattern=productId contains invalid characters.
shipmentOrder.error.productId.size=productId must not exceed 256 characters.
shipmentOrder.error.quantity.min=quantity must be greater than zero.
shipmentOrder.error.quantity.notNull=quantity is required.
shipmentOrder.error.rejectionReason.notBlank=reason must not be blank.
shipmentOrder.error.rejectionReason.size=reason must not exceed 512 characters.
shipmentOrder.error.supplierId.notBlank=supplierId must not be null or blank.
shipmentOrder.error.supplierId.pattern=supplierId contains invalid characters.
shipmentOrder.error.supplierId.size=supplierId must not exceed 256 characters.

# storageReading
storageReading.error.humidity.notNull=humidity must not be null.
storageReading.error.recordedAt.notNull=recordedAt must not be null.
storageReading.error.source.notBlank=source must not be null or blank.
storageReading.error.source.pattern=source must be SENSOR or MANUAL.
storageReading.error.storageZoneId.min=storageZoneId must be greater than 0.
storageReading.error.storageZoneId.notNull=storageZoneId must not be null.
storageReading.error.temperature.notNull=temperature must not be null.

# storageZone
storageZone.error.humidity.notNull=humidity values must not be null.
storageZone.error.humidity.range=humidity must be between 0.0 and 100.0 percent.
storageZone.error.name.notBlank=name must not be null or blank.
storageZone.error.name.size=name must not exceed 100 characters.
storageZone.error.storageCondition.notBlank=storageCondition must not be null or blank.
storageZone.error.storageCondition.pattern=storageCondition must be REFRIGERATED, COOL, AMBIENT or FROZEN.
storageZone.error.temperature.notNull=temperature values must not be null.
storageZone.error.temperature.range=temperature must be between -50.0 and 60.0 Celsius.

# supplier
supplier.error.businessName.notBlank=businessName must not be null or blank.
supplier.error.businessName.size=businessName must not exceed 256 characters.
supplier.error.categories.notEmpty=At least one category is required.
supplier.error.categories.pattern=category must be FRUITS_AND_VEGETABLES, GRAINS, DAIRY or FROZEN.
supplier.error.contactName.notBlank=contactName must not be null or blank.
supplier.error.contactName.size=contactName must not exceed 256 characters.
supplier.error.email.notBlank=email must not be null or blank.
supplier.error.email.pattern=email is not a valid email address.
supplier.error.email.size=email must not exceed 256 characters.
supplier.error.organicCertification.notBlank=organicCertification must not be null or blank.
supplier.error.organicCertification.pattern=organicCertification contains invalid characters.
supplier.error.organicCertification.size=organicCertification must not exceed 64 characters.
supplier.error.phoneNumber.notBlank=phoneNumber must not be null or blank.
supplier.error.phoneNumber.pattern=phoneNumber may only contain digits, spaces, '-' and a leading '+'.
supplier.error.phoneNumber.size=phoneNumber must not exceed 20 characters.

# supplyRequest
supplyRequest.error.minimarketId.notBlank=minimarketId must not be null or blank.
supplyRequest.error.minimarketId.pattern=minimarketId contains invalid characters.
supplyRequest.error.minimarketId.size=minimarketId must not exceed 256 characters.
supplyRequest.error.priority.notBlank=priority must not be null or blank.
supplyRequest.error.priority.pattern=priority must be LOW, MEDIUM or HIGH.
supplyRequest.error.productId.notBlank=productId must not be null or blank.
supplyRequest.error.productId.pattern=productId contains invalid characters.
supplyRequest.error.productId.size=productId must not exceed 256 characters.
supplyRequest.error.quantity.min=quantity must be greater than zero.
supplyRequest.error.quantity.notNull=quantity is required.
supplyRequest.error.requestReason.notBlank=reason must not be null or blank.
supplyRequest.error.requestReason.size=reason must not exceed 512 characters.
supplyRequest.error.requiredDate.notNull=requiredDate is required.
supplyRequest.error.supplierId.notBlank=supplierId must not be null or blank.
supplyRequest.error.supplierId.pattern=supplierId contains invalid characters.
supplyRequest.error.supplierId.size=supplierId must not exceed 256 characters.

# user
user.error.email.size=email must not exceed 256 characters.
user.error.fullName.size=fullName must not exceed 256 characters.
user.error.minimarketId.pattern=minimarketId contains invalid characters. Only letters, digits, '_' and '-' are allowed.
user.error.minimarketId.size=minimarketId must not exceed 256 characters.
user.error.supplierId.pattern=supplierId contains invalid characters. Only letters, digits, '_' and '-' are allowed.
user.error.supplierId.size=supplierId must not exceed 256 characters.
